<svg width="1400" height="560" viewBox="0 0 1400 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Easy-Job-Tutor Skill workflow</title>
  <desc id="desc">A visual workflow from target role and resume input to JD analysis, resume optimization, application materials, PDF resume building, and verification.</desc>
  <rect width="1400" height="560" rx="34" fill="#F7FAFC"/>
  <rect x="38" y="38" width="1324" height="484" rx="28" fill="white" stroke="#D9E2EC" stroke-width="2"/>
  <text x="86" y="112" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#102A43">Easy-Job-Tutor</text>
  <text x="86" y="154" font-family="Inter, Arial, sans-serif" font-size="22" fill="#486581">JD analysis -> resume optimization -> application materials -> ATS-friendly PDF</text>
  <g transform="translate(86 220)">
